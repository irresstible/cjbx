<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="一起过新年 - 注册账号">
    <link rel="shortcut icon" href="img/favicon.ico">
    <title>注册账号</title>
    <link rel="stylesheet" href="css/reset.css?v=20260920b">
    <link rel="stylesheet" href="css/common.css?v=20260920b">
    <link rel="stylesheet" href="css/forms.css?v=20260920b">
    <link rel="stylesheet" href="css/zhuce.css?v=20260920b">
</head>
<body>
    <div class="login-box">
        <h2>注册账号</h2>
        <form id="registerForm">
            <div class="user-box">
                <input type="text" name="username" id="username" autocomplete="username" maxlength="16" required="">
                <label>用户名</label>
            </div>
            <div class="user-box">
                <input type="password" name="pwd" id="pwd" autocomplete="new-password" required="">
                <label>密码</label>
            </div>
            <!-- 确认密码 -->
            <div class="user-box">
                <input type="password" name="pwd2" id="pwd2" autocomplete="new-password" required="">
                <label>确认密码</label>
            </div>
            <!-- 手机号+获取验证码行 -->
            <div class="user-box phone-box">
                <div class="phone-input">
                    <input type="text" name="phone" id="phone" autocomplete="tel" inputmode="numeric" maxlength="11" required="">
                    <label>手机号</label>
                </div>
                <span class="code-btn" id="getCodeBtn">获取验证码</span>
            </div>
            <!-- 验证码输入框 -->
            <div class="user-box">
                <input type="text" name="verifyCode" id="verifyCode" inputmode="numeric" maxlength="6" required="">
                <label>验证码</label>
            </div>
            <!-- 注册按钮居中容器 -->
            <div class="register-btn-wrap">
                <a href="#" class="register-btn" id="registerBtn">注册账号</a>
            </div>
            <div class="back-login">已有账号？<a href="denlu.html">返回登录</a></div>
        </form>
    </div>

    <script type="module" src="js/pages/register.js?v=20260920c"></script>
</body>
</html>
