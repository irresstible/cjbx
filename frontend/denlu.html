<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="一起过新年 - 登录账号">
    <link rel="shortcut icon" href="img/favicon.ico">
    <title>登录账号</title>
    <link rel="stylesheet" href="css/reset.css?v=20260920b">
    <link rel="stylesheet" href="css/common.css?v=20260920b">
    <link rel="stylesheet" href="css/forms.css?v=20260920b">
    <link rel="stylesheet" href="css/denlu.css?v=20260920b">
</head>
<body>
    <div class="login-box">
        <h2>登录账号</h2>
        <form id="loginForm">
            <div class="user-box">
                <input type="text" id="username" name="username" autocomplete="username" required="">
                <label>用户名</label>
            </div>
            <div class="user-box">
                <input type="password" id="pwd" name="pwd" autocomplete="current-password" required="">
                <label>密码</label>
                <span class="toggle-pwd" id="togglePwd">
                    <svg id="eyeOpen" viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                        <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zm0 12.5c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
                    </svg>
                    <svg id="eyeClose" viewBox="0 0 24 24" width="20" height="20" fill="currentColor" style="display:none">
                        <path d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.43-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.16c0-1.66-1.34-3-3-3l-.17.01z"/>
                    </svg>
                </span>
            </div>
            <!-- 记住密码 + 忘记密码 -->
            <div class="login-options">
                <label class="remember-label">
                    <input type="checkbox" id="rememberMe">
                    记住密码
                </label>
                <a href="wangji.html" class="forget-link">忘记密码？</a>
            </div>
            <div class="login-btn-wrap">
                <a href="#" class="login-btn" id="loginBtn">登录</a>
            </div>
            <div class="back-register">没有账号？<a href="zhuce.html">立即注册</a></div>
        </form>
    </div>

    <script type="module" src="js/pages/login.js?v=20260920c"></script>
</body>
</html>
